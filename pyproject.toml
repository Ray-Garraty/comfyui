[tool.ruff]
target-version = "py312"
line-length = 120
src = ["provision/lib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["provision/lib/comfyprov", "provision/tests"]
extraPaths = ["provision/lib", "provision/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["provision/tests"]
markers = ["e2e: end-to-end test that starts ComfyUI and generates a real image"]
pythonpath = ["provision/lib", "provision/tests"]
